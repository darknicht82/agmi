# A&G Market Intelligence — servicios locales
# Uso: docker compose up -d
# La contraseña se toma de .env (obligatoria). Sin fallback.

services:
  db:
    image: postgres:16-alpine
    container_name: agmarket-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB es obligatoria}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER es obligatoria}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD es obligatoria - sin fallback}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - agmarket_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  agmarket_pgdata:
